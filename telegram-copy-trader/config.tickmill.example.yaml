# =====================================================================
# Tickmill (arkadaşın MT5 hesabı) için config.yaml'a EKLENECEK PARÇA
#
# Bu dosya tek başına çalışan bir ayar dosyası DEĞİLDİR.
# Kendi config.yaml'ınıza iki yer eklenir (adımlar: docs/OWNER_TICKMILL_EKLE.md):
#   1) "brokers:" listesinin SONUNA aşağıdaki "tickmill" bloğu.
#   2) "telegram: topics:" içindeki iki konunun "brokers" satırına "tickmill".
#
# Önce .env dosyasına şu iki satırı yazın (arkadaşınızdan gelen değerler):
#   METAAPI_TOKEN=...
#   METAAPI_ACCOUNT_ID=...
#
# Güvenlik: "optional: true" sayesinde Tickmill bağlanamazsa bot DURMAZ.
# Binance, Breakout ve FundingPips aynen çalışır. Size sadece uyarı gelir.
# =====================================================================

# ---------------------------------------------------------------------
# 1) brokers: listesinin sonuna eklenecek blok
# ---------------------------------------------------------------------
brokers:
  - name: tickmill
    type: metaapi                       # metaapi.cloud üzerinden MT5 (arkadaşınız hesabını orada bağlar)
    enabled: true
    optional: true                      # bağlanamazsa bot durmaz; uyarı gelir, sinyaller bu hesapta atlanır
    token: ${METAAPI_TOKEN:-}           # .env; boşsa bağlantı kurulamaz ve sadece uyarı gelir
    account_id: ${METAAPI_ACCOUNT_ID:-} # .env
    risk_usd: 5                         # 1R'de kaybedilecek tutar (USD). Küçük başlayın.
    # Sinyal grafikleri Binance vadeli (ör. BTCUSDT.P). Tickmill CFD fiyatı biraz farklıdır:
    # giriş / stop / hedefler iki fiyat arasındaki farkla kaydırılır.
    reference_exchange: binanceusdm
    offset_mode: additive
    max_offset_pct: 1.0                 # fark %1'i aşarsa işlem açılmaz
    # LIMIT girişte brokerda emir bekletme. Binance fiyatı seviyeye değince farkı o an ölç ve MARKET aç:
    entry_trigger: reference_touch
    virtual_trigger_max_hours: 48       # tetiklenmezse 48 saat sonra iptal
    # YER TUTUCU: arkadaşınızın MT5 "Market Watch" listesindeki TAM sembol adlarını yazın.
    # Tickmill'de kripto CFD adları ve sonekleri farklı olabilir (ör. BTCUSD, ETHUSD).
    symbol_map: {BTC: BTCUSD, ETH: ETHUSD}
    # YER TUTUCU: sadece Tickmill'de gerçekten işlem gören varlıklar (boş = hepsi denenir).
    allowed_assets: [BTC, ETH, EUR, GBP, XAU]
    no_hedge: true                      # aynı varlıkta ters yönlü işlem açma
    daily_loss_limit_pct: 3             # günlük zarar %3'ü geçerse bu hesapta yeni işlem açılmaz

# ---------------------------------------------------------------------
# 2) telegram.topics: sizin MEVCUT konularınız, sadece "tickmill" eklenmiş hali.
#    Kendi başlık metinlerinizi (title_contains) ve diğer ayarlarınızı koruyun;
#    yalnızca "brokers" satırına tickmill'i ekleyin.
# ---------------------------------------------------------------------
telegram:
  topics:
    - name: kripto
      title_contains: ["Kripto İşlemleri"]
      brokers: [binance, breakout, tickmill]    # <- tickmill eklendi
      kind: crypto
    - name: fx
      title_contains: ["Fx İşlemleri"]
      brokers: [fx, tickmill]                   # <- tickmill eklendi
      kind: fx
